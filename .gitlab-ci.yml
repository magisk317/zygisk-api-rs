image: rust:1.98.0-trixie

stages:
  - verify
  - cross-compile
  - sync

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/

format:
  stage: verify
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

test:
  stage: verify
  script:
    - cargo test --all-targets --locked

clippy:
  stage: verify
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --locked -- -D warnings

compile-arm:
  stage: cross-compile
  script:
    - rustup target add aarch64-linux-android armv7-linux-androideabi
    - cargo check --target aarch64-linux-android --locked
    - cargo check --target armv7-linux-androideabi --locked
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

sync:github:
  stage: sync
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -euo pipefail
      git remote add github "https://magisk317:${GITHUB_PAT}@github.com/magisk317/${CI_PROJECT_NAME}.git" || true
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push github "$CI_COMMIT_TAG" --force
        git push github --tags --force
      else
        git push github "$CI_COMMIT_BRANCH" --force
      fi
