image: rust:1.98.0-trixie

stages:
  - verify
  - cross-compile
  - sync

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TERM_COLOR: always

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/

format:
  stage: verify
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

test:
  stage: verify
  script:
    - cargo test --all-targets --locked

clippy:
  stage: verify
  script:
    - rustup component add clippy
    - cargo clippy --all-targets --locked -- -D warnings

compile-arm:
  stage: cross-compile
  script:
    - rustup target add aarch64-linux-android armv7-linux-androideabi
    - cargo check --target aarch64-linux-android --locked
    - cargo check --target armv7-linux-androideabi --locked
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

sync:github:
  stage: sync
  needs: []
  image: alpine:latest
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -euo pipefail
      # GITHUB_PAT is a group-level protected variable, so it is only injected on
      # protected refs. Tag pipelines receive it only when the tag matches a
      # protected tag rule (v*); otherwise fall back to a project-level
      # GITHUB_RELEASE_TOKEN when one is configured.
      sync_token="${GITHUB_PAT:-${GITHUB_RELEASE_TOKEN:-}}"
      if [ -z "$sync_token" ]; then
        echo "ERROR: neither GITHUB_PAT nor GITHUB_RELEASE_TOKEN is available on $CI_COMMIT_REF_NAME (protected=$CI_COMMIT_REF_PROTECTED)" >&2
        echo "       Make the tag match a protected tag rule (e.g. v*) so the protected group variable is injected." >&2
        exit 1
      fi
      git remote add github "https://magisk317:${sync_token}@github.com/magisk317/${CI_PROJECT_NAME}.git" || true
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push github "$CI_COMMIT_TAG" --force
        git push github --tags --force
      else
        git push github "HEAD:refs/heads/$CI_COMMIT_BRANCH" --force
      fi
